name: BTC Whale and Strategy Tracker

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      reset_strategy:
        description: 'Nustatyti Strategy SEC istoriją iš naujo (nesiųs senų dokumentų, tik nuo dabar naujus)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  whale-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run whale tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESET_STRATEGY: ${{ github.event.inputs.reset_strategy || 'false' }}
        run: python whale_tracker.py

      - name: Commit updated state file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add whale_state.json
          git diff --staged --quiet || git commit -m "Update whale tracker state"
          git pull --rebase origin main
          git push
