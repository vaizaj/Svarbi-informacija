name: Daily Market Overview

on:
  schedule:
    # Kasdien 23:00 Lietuvos laiku (EEST/UTC+3 vasarą, UTC+2 žiemą) = 20:00 UTC (apytiksliai)
    - cron: '0 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-overview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser deep-translator yfinance

      - name: Run daily market overview
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_market_overview.py
