name: Daily Crypto Summary

on:
  schedule:
    # 6:00 UTC = 9:00 Lietuvos laiku (vasaros metu, EEST/UTC+3)
    # PASTABA: žiemos metu (EET/UTC+2) tai bus 8:00 Lietuvos laiku -
    # jei nori tikslaus 9:00 visais metų laikais, teks koreguoti cron
    # ranka spalio/kovo mėnesį (žr. laiko keitimo datas)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Send daily summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_summary.py
